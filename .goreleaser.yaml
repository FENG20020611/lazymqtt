version: 2

project_name: lazymqtt

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: lazymqtt
    main: ./cmd/lazymqtt
    binary: lazymqtt
    # A single static binary is the whole distribution story: no cgo, no
    # runtime dependency, no MQTT library to install alongside it.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Onizuka893/lazymqtt/internal/version.Version={{ .Version }}
      - -X github.com/Onizuka893/lazymqtt/internal/version.Commit={{ .FullCommit }}
      - -X github.com/Onizuka893/lazymqtt/internal/version.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is untested terminal territory; the amd64 build is
      # already best-effort.
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: lazymqtt
    ids: [lazymqtt]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: deploy/**/*
        dst: deploy

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

# Homebrew is a cask rather than a formula: Homebrew deprecated binary-only
# formulae, and goreleaser deprecated `brews:` to match. The tap lives at
# github.com/Onizuka893/homebrew-tap, so `brew install Onizuka893/tap/lazymqtt`
# works without adding the tap first.
homebrew_casks:
  - name: lazymqtt
    ids: [lazymqtt]
    binaries: [lazymqtt]
    homepage: "https://github.com/Onizuka893/lazymqtt"
    description: "A keyboard-driven TUI MQTT client, in the spirit of lazygit"
    license: "MIT"
    # A prerelease must not become what `brew install lazymqtt` gives people.
    # `auto` skips the tap update for any version goreleaser treats as a
    # prerelease, which is the same rule `release.prerelease: auto` uses.
    skip_upload: auto
    repository:
      owner: Onizuka893
      name: homebrew-tap
      branch: main
      # A repo-scoped PAT for the tap repository. The default GITHUB_TOKEN is
      # scoped to this repository only and cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "lazymqtt {{ .Tag }}"
    hooks:
      post:
        install: |
          # The binary is unsigned, so a downloaded archive carries the
          # quarantine attribute and Gatekeeper refuses to run it. Without
          # this, `brew install` succeeds and the first `lazymqtt` fails with
          # a dialog that says nothing useful.
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazymqtt"]
          end

release:
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    ## Install

    Homebrew (macOS and Linux):

    ```sh
    brew install Onizuka893/tap/lazymqtt
    ```

    From source:

    ```sh
    go install github.com/Onizuka893/lazymqtt/cmd/lazymqtt@{{ .Tag }}
    ```

    Or download the archive for your platform, verify it against
    `checksums.txt`, and put the binary on your `PATH`:

    ```sh
    tar -xzf lazymqtt_{{ .Version }}_macOS_arm64.tar.gz
    install -m 0755 lazymqtt /usr/local/bin/lazymqtt
    ```

    On macOS a downloaded binary is unsigned, so Gatekeeper quarantines it —
    the Homebrew cask clears that for you, a manual install does not:

    ```sh
    xattr -d com.apple.quarantine /usr/local/bin/lazymqtt
    ```

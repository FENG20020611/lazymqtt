listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# TLS listener. Run `make certs` first; without the files mosquitto logs a
# warning for this listener and keeps serving the plain one.
listener 8883
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server-key.pem
require_certificate false
allow_anonymous true

# Mutual TLS. The client must present a certificate signed by the dev CA,
# which is what the mTLS integration test connects to.
listener 8884
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server-key.pem
require_certificate true
use_identity_as_username true

sys_interval 10
persistence false
log_dest stdout

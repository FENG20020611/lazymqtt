name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          files=$(gofumpt -l .)
          if [ -n "$files" ]; then
            echo "::error::not gofumpt-formatted:"
            echo "$files"
            gofumpt -d .
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go vet ./...
      # The integration suite is behind a build tag, so the line above never
      # type-checks it. It must at least compile on every platform.
      - run: go vet -tags=integration ./test/...
      - run: go test -race -shuffle=on ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # The dev compose stack rather than a `services:` container, because the
      # suite needs more than one broker: TLS on 8883, mutual TLS on 8884, and
      # a password-protected broker on 1884. It is also the same stack
      # `make test-int` uses, so a CI failure reproduces locally verbatim, and
      # the reconnect test can restart the container by name.
      - name: generate dev certificates
        run: make certs

      - name: start brokers
        run: docker compose -f deploy/docker-compose.yml up -d

      # Poll with a real PUBLISH rather than a port check: the port is
      # listening well before the broker will answer, and a TCP-only probe
      # turns a slow start into a confusing test failure downstream.
      - name: wait for brokers
        run: |
          compose() { docker compose -f deploy/docker-compose.yml "$@"; }
          wait_ready() {
            svc=$1; shift
            for i in $(seq 1 60); do
              if compose exec -T "$svc" \
                  mosquitto_pub -h localhost -t ci/ready -m ok "$@" \
                  >/dev/null 2>&1; then
                echo "$svc answering after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$svc never became ready"
            compose logs "$svc"
            return 1
          }
          wait_ready mosquitto
          wait_ready mosquitto-auth -u lazymqtt -P secret

      # Longer than the default 10m: the retained-flood test publishes 20,000
      # messages and the reconnect test restarts a container.
      - run: go test -tags=integration -race -timeout 20m ./test/...

      - name: broker logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: stop brokers
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/lazymqtt

  # Proves the release pipeline on every push, so a broken .goreleaser.yaml is
  # found here rather than at tag time when it is too late to fix quietly.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

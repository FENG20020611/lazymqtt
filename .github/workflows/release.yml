name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser needs the full history and tags to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # Never publish a tag that does not pass its own tests.
      - run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A repo-scoped PAT with write access to Onizuka893/homebrew-tap.
          # The default GITHUB_TOKEN cannot push to another repository, so
          # without this secret the cask step fails after the release has
          # already been published — see docs/releasing.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
